name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: Tests & end-to-end run
    runs-on: ubuntu-latest
    needs: quality
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # Unit + integration tests run fully offline (mock / fake LLM clients)
      - run: python -m pytest
      - name: End-to-end run (offline mock)
        run: python run_pipeline.py --provider mock --report-name ci_mock_report.xlsx
      - name: End-to-end run (recorded Gemini responses, no key needed)
        if: ${{ hashFiles('recordings/*.json') != '' }}
        run: python run_pipeline.py --provider replay --report-name ci_replay_report.xlsx
      # Live Gemini run + accuracy gate only when the repository secret is configured
      - name: End-to-end run (live Gemini) + accuracy gate
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: |
          python run_pipeline.py --provider gemini --no-cache --report-name ci_gemini_report.xlsx
          python scripts/evaluate_extraction.py --min-accuracy 0.9
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reconciliation-reports
          path: |
            output/*.xlsx
            output/logs/*.log
