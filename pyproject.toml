[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tsrecon"
version = "1.0.0"
description = "LLM-powered term sheet vs booking reconciliation (Gemini + PySpark)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyspark==3.5.3", "pandas>=2.0,<3.0", "google-genai>=1.0", "pydantic>=2.6,<3", "pdfplumber>=0.11",
  "pypdf>=4.0", "python-docx>=1.1", "openpyxl>=3.1", "tenacity>=8.2", "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tsrecon = "tsrecon.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["sample_output", "recordings"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
files = ["src/tsrecon"]
